<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Water } from 'three/addons/objects/Water.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

// =============================================================== setup
const isTouch = matchMedia('(pointer: coarse)').matches || matchMedia('(hover: none)').matches;
if (isTouch) document.body.classList.add('touch');
const LITE = (() => {
  try { const pq = localStorage.getItem('prayagrajQuality'); if (pq === '0') return true; if (pq === '1' || pq === '2') return false; } catch (e) {}
  const q = new URLSearchParams(location.search).get('lite');
  if (q === '1') return true; if (q === '0') return false;
  try { if (localStorage.getItem('archvizLite') === '1') return true; } catch (e) {}
  const mem = navigator.deviceMemory, cores = navigator.hardwareConcurrency || 8;
  return (mem && mem <= 3) || (isTouch && cores <= 4);
})();
let QUAL = LITE ? 0 : (isTouch ? 1 : 2);           // 0 Lite · 1 High · 2 Ultra
try { const pq = localStorage.getItem('prayagrajQuality'); if (!LITE && (pq === '1' || pq === '2')) QUAL = +pq; } catch (e) {}
const ULTRA = QUAL === 2;
const VIEW = LITE ? 520 : ULTRA ? 1400 : 1100;          // how far the city is drawn (metres)
const CH = 200;                          // city chunk size (metres)
const renderer = new THREE.WebGLRenderer({ antialias: !LITE, powerPreference: 'high-performance' });
renderer.setPixelRatio(LITE ? 0.75 : Math.min(devicePixelRatio, isTouch ? 1.25 : (QUAL === 2 ? 1.75 : 1.5)));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = !LITE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  if (!LITE) { try { localStorage.setItem('archvizLite', '1'); } catch (err) {} location.reload(); }
  else alert('This phone ran out of memory for 3D. Close other apps and reopen the game.');
});
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.3, VIEW * 2.2);
const std = (o) => new THREE.MeshStandardMaterial(o);
const clock = new THREE.Clock();
const MAXANISO = Math.min(16, renderer.capabilities.getMaxAnisotropy());

// sky, sun, haze
const sky = new Sky(); sky.scale.setScalar(20000); scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 1.1; skyU.rayleigh.value = 3.0; skyU.mieCoefficient.value = 0.002; skyU.mieDirectionalG.value = 0.8;
const sun = new THREE.DirectionalLight(0xfff1dc, 3.0);
sun.castShadow = !LITE;
const SH = isTouch ? 2048 : 4096, SR = isTouch ? 90 : 120;
sun.shadow.mapSize.set(SH, SH);
Object.assign(sun.shadow.camera, { left: -SR, right: SR, top: SR, bottom: -SR, near: 1, far: 700 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x8a7a62, 1.1); scene.add(hemi);
scene.fog = new THREE.FogExp2(0xa9bfd6, LITE ? 0.0013 : 0.00038);
const pmrem = new THREE.PMREMGenerator(renderer);
var clouds = null, waterFX = null;
{ // soft cloud layer high above the city
  const c = document.createElement('canvas'); c.width = c.height = 1024; const x = c.getContext('2d');
  let sd = 7; const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  for (let i = 0; i < 260; i++) {
    const cx = r() * 1024, cy = r() * 1024, rad = 30 + r() * 110, g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, `rgba(255,255,255,${0.10 + r() * 0.16})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    for (const [ox, oy] of [[0, 0], [1024, 0], [-1024, 0], [0, 1024], [0, -1024]]) { x.fillStyle = g; x.save(); x.translate(ox, oy); x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2); x.restore(); }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  clouds = new THREE.Mesh(new THREE.PlaneGeometry(16000, 16000), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: 0.85, depthWrite: false, fog: false }));
  clouds.rotation.x = Math.PI / 2; clouds.position.y = 700; clouds.renderOrder = -1; scene.add(clouds);
}
let night = 0, nightTarget = 0, envTimer = 0;
const sunDir = new THREE.Vector3();
function applySky() {
  const elev = THREE.MathUtils.lerp(27, -8, night), az = 232;          // warm late-afternoon sun
  sunDir.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - elev), THREE.MathUtils.degToRad(az));
  skyU.sunPosition.value.copy(sunDir);
  const dayK = THREE.MathUtils.clamp(1 - night * 1.15, 0, 1);
  sun.intensity = 4.6 * dayK + 0.12; sun.color.setHSL(0.085, 0.75, THREE.MathUtils.lerp(0.86, 0.72, night));
  if (clouds) { clouds.material.opacity = THREE.MathUtils.lerp(1.0, 0.18, night); clouds.material.color.setHSL(0.08, 0.5, THREE.MathUtils.lerp(0.88, 0.25, night)); }

  if (waterFX) waterFX.material.uniforms.time.value = t * 0.6;
  if (clouds) { clouds.material.map.offset.set(t * 0.0012, t * 0.0007); clouds.position.x = focus.x; clouds.position.z = focus.z; }
  updateOthers(dt);
  if (started || introT > 0) updateLife(dt, t);
  if (started) { updateMission(); updateHUD(dt); sendState(dt); }
  if (phoneOpen && document.getElementById('pg-map').classList.contains('on')) drawMapApp();
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (wantPhoto) { wantPhoto = false; photos.push(renderer.domElement.toDataURL('image/jpeg', 0.85)); toast('📸 Photo saved to your phone'); }
}

// =============================================================== start
(async () => {
  applySky(); refreshEnv();
  try { await loadWorld(); } catch (e) { console.error(e); return; }
  player.x = spawn.x; player.z = spawn.z;
  if (spawn.road) { const p = spawn.road.pts, k = Math.min(spawn.k, p.length - 4); player.yaw = Math.atan2(-(p[k + 2] - p[k]), -(p[k + 3] - p[k + 1])) || 0; }
  camYaw = player.yaw + Math.PI;
  focus.x = player.x; focus.z = player.z;
  introC.x = player.x + 60; introC.z = player.z + 180;        // the flyover circles over the Yamuna just south of the ghat
  focus.x = introC.x; focus.z = introC.z;
  setProgress(92, 'Planting trees and street lights…'); await new Promise(r => setTimeout(r, 40));
  updateChunks(0, true);
  buildMissions(); drawFullMap(); persist(); initLife();
  setProgress(100, 'Welcome to Prayagraj'); clearInterval(tipTimer);
  const loading = document.getElementById('loading'); loading.style.opacity = 0; setTimeout(() => loading.style.display = 'none', 850);
  const splash = document.getElementById('splash'); splash.style.display = 'flex';
  // live 3D preview of your character on the entry card
  const pv = document.getElementById('preview');
  const pr = new THREE.WebGLRenderer({ canvas: pv, alpha: true, antialias: true });
  pr.setPixelRatio(Math.min(devicePixelRatio, 2)); pr.setSize(pv.clientWidth || 150, pv.clientHeight || 180, false); pr.toneMapping = THREE.ACESFilmicToneMapping;
  const ps = new THREE.Scene(); ps.add(new THREE.HemisphereLight(0xfff4e0, 0x5a4030, 1.8));
  const pdl = new THREE.DirectionalLight(0xffd9a0, 3); pdl.position.set(2, 3, 3); ps.add(pdl);
  const prim = new THREE.DirectionalLight(0x88aaff, 1.5); prim.position.set(-3, 2, -2); ps.add(prim);
  const pc = new THREE.PerspectiveCamera(28, (pv.clientWidth || 150) / (pv.clientHeight || 180), 0.1, 50); pc.position.set(0, 1.05, 4.4); pc.lookAt(0, 0.88, 0);
  let pm = null, pvOn = true;
  const setPreview = () => { if (pm) ps.remove(pm); pm = makeCharacter(myAvatar, myAvatar === 'girl' ? 0xd94f8a : 0x2f6fd6); pm.rotation.y = Math.PI; ps.add(pm); };
  (function spin() { if (!pvOn) return; requestAnimationFrame(spin); if (pm) { pm.rotation.y += 0.01; animateCharacter(pm, 0, 0.016); } pr.render(ps, pc); })();
  document.getElementById('ctrlhelp').textContent = isTouch ? 'Joystick to walk/drive · swipe to look · 🚗 get in · 📱 phone' : 'WASD walk/drive · drag to look · E car · M phone · N night';
  const nameIn = document.getElementById('name');
  try { const s = JSON.parse(localStorage.getItem('archvizPlayer') || '{}'); if (s.name) nameIn.value = s.name; if (s.avatar) myAvatar = s.avatar; } catch (e) {}
  document.querySelectorAll('.pick button').forEach(b => { b.classList.toggle('on', b.dataset.a === myAvatar); b.onclick = () => { myAvatar = b.dataset.a; document.querySelectorAll('.pick button').forEach(x => x.classList.toggle('on', x === b)); setPreview(); }; });
  setPreview();
  frame();
  document.getElementById('play').onclick = () => {
    myName = nameIn.value.trim().slice(0, 18) || (myAvatar === 'girl' ? 'Riya' : 'Aryan');
    try { localStorage.setItem('archvizPlayer', JSON.stringify({ name: myName, avatar: myAvatar })); } catch (e) {}
    splash.style.display = 'none';
    pvOn = false; pr.dispose(); pr.forceContextLoss();
    avatar = makeCharacter(myAvatar, myAvatar === 'girl' ? 0xd94f8a : 0x2f6fd6); scene.add(avatar);
    drop = { t: 0, from: camera.position.clone(), fromQ: camera.quaternion.clone() };
    focus.x = player.x; focus.z = player.z; updateChunks(0, true);
    started = true; summonCar('suv'); setButtons(); connect();
    hint(isTouch ? 'Walk to your car and tap 🚗 to drive • 📱 for missions' : 'Walk to your car and press E to drive • M opens your phone for missions', 5000);
  };
})();
</script>
